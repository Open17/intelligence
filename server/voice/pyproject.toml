[project]
name = "intelligence-voice"
version = "0.1.0"
description = "Voice server: wake phrase, speech-to-text (echo), Claude via the Agent SDK, Piper text-to-speech"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.188",
    "websockets==17.4",
    "piper-tts==1.8.0",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
intelligence-voice = "intelligence.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intelligence*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
